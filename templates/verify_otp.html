<!DOCTYPE html>
<html lang="en">

<head>

    <title>Verify OTP</title>

    <style>

        body {
            font-family: Arial;
            background: #eef7ff;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.15);
        }

        h2 {
            text-align: center;
            color: #087ea4;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #087ea4;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Verify OTP</h2>

    <p>
        Enter the 6-digit OTP sent to your email.
    </p>

    <form method="POST">

        <input
            type="hidden"
            name="email"
            value="{{ email }}"
        >

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            required
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

</body>
</html>
