
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New User Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .info {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #125ea7;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #1976d2;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>New User Registration</h2>

    <div class="info">
        Your email must be authorized by the administrator before registration.
    </div>


    <!-- EMAIL -->

    <label for="email">
        Authorized Email
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter email authorized by admin"
    >


    <button
        type="button"
        id="sendOtpButton"
        onclick="sendOTP()"
    >
        Send OTP
    </button>


    <!-- OTP -->

    <label for="otp">
        OTP
    </label>

    <input
        type="text"
        id="otp"
        maxlength="6"
        placeholder="Enter 6 digit OTP"
    >

    <button
        type="button"
        id="verifyOtpButton"
        onclick="verifyOTP()"
        disabled
    >
        Verify OTP
    </button>


    <!-- USERNAME -->

    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Create username"
    >


    <!-- PASSWORD -->

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Create password"
    >


    <!-- REGISTER -->

    <button
        type="button"
        id="registerButton"
        onclick="registerUser()"
        disabled
    >
        Register
    </button>


    <p id="message"></p>


    <div class="login-link">
        Already registered?
        <a href="/login">Login</a>
    </div>

</div>

<a href="/login" style="position: fixed; bottom: 10px; right: 10px; text-decoration: none; color: #1976d2;">
    Back to Login
</a>

<script>

let otpVerified = false;


// =========================================================
// SHOW MESSAGE
// =========================================================

function showMessage(message, success = false) {

    const messageElement =
        document.getElementById("message");

    messageElement.innerText = message;

    if (success) {
        messageElement.style.color = "green";
    } else {
        messageElement.style.color = "red";
    }
}


// =========================================================
// SEND OTP
// =========================================================

async function sendOTP() {

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    if (!email) {

        showMessage(
            "Please enter your email address."
        );

        return;
    }


    const button =
        document.getElementById("sendOtpButton");

    button.disabled = true;

    button.innerText = "Sending OTP...";


    try {

        const response = await fetch(
            "/auth/send-registration-otp",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email
                })
            }
        );


        const result = await response.json();


        if (response.ok && result.success) {

            showMessage(
                "OTP sent successfully. Check your email.",
                true
            );

            document.getElementById(
                "verifyOtpButton"
            ).disabled = false;

        } else {

            showMessage(
                result.message ||
                "Unable to send OTP."
            );

            button.disabled = false;
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Server error. Please try again."
        );

        button.disabled = false;

    } finally {

        button.innerText = "Send OTP";
    }
}


// =========================================================
// VERIFY OTP
// =========================================================

async function verifyOTP() {

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const otp =
        document.getElementById("otp").value.trim();


    if (!email || !otp) {

        showMessage(
            "Enter email and OTP."
        );

        return;
    }


    if (otp.length !== 6) {

        showMessage(
            "OTP must contain 6 digits."
        );

        return;
    }


    const button =
        document.getElementById("verifyOtpButton");

    button.disabled = true;

    button.innerText = "Verifying...";


    try {

        const response = await fetch(
            "/auth/verify-registration-otp",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    otp: otp
                })
            }
        );


        const result = await response.json();


        if (response.ok && result.success) {

            otpVerified = true;

            showMessage(
                "OTP verified successfully.",
                true
            );


            document.getElementById(
                "registerButton"
            ).disabled = false;


            document.getElementById(
                "email"
            ).readOnly = true;


            document.getElementById(
                "otp"
            ).readOnly = true;


            button.innerText = "OTP Verified";

        } else {

            otpVerified = false;

            showMessage(
                result.message ||
                "Invalid OTP."
            );

            button.disabled = false;

            button.innerText = "Verify OTP";
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Server error. Please try again."
        );

        button.disabled = false;

        button.innerText = "Verify OTP";
    }
}


// =========================================================
// COMPLETE REGISTRATION
// =========================================================

async function registerUser() {

    if (!otpVerified) {

        showMessage(
            "Please verify your OTP first."
        );

        return;
    }


    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const otp =
        document.getElementById("otp").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !otp || !username || !password) {

        showMessage(
            "Please fill all fields."
        );

        return;
    }


    const button =
        document.getElementById("registerButton");

    button.disabled = true;

    button.innerText = "Creating account...";


    try {

        const response = await fetch(
            "/auth/complete-registration",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    otp: otp,

                    username: username,

                    password: password
                })
            }
        );


        const result = await response.json();


        if (response.ok && result.success) {

            showMessage(
                "Registration successful. Redirecting to login...",
                true
            );


            setTimeout(
                function() {
                    window.location.href = "/login";
                },
                1500
            );

        } else {

            showMessage(
                result.message ||
                "Registration failed."
            );

            button.disabled = false;

            button.innerText = "Register";
        }

    } catch (error) {

        console.error(error);

        showMessage(
            "Server error. Please try again."
        );

        button.disabled = false;

        button.innerText = "Register";
    }
}

</script>

</body>
</html>
