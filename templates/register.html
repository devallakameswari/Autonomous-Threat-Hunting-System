<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>New User Registration - Autonomous Threat Hunting System</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           BODY
        ========================================================= */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #17324d;

            background:
                linear-gradient(
                    135deg,
                    #0877bd 0%,
                    #0064a8 45%,
                    #003f86 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            position: relative;

            overflow-y: auto;
        }


        /* =========================================================
           BACKGROUND SHAPES
        ========================================================= */

        .shape {

            position: fixed;

            pointer-events: none;

            opacity: 0.12;

            z-index: 0;
        }


        .shape1 {

            width: 520px;
            height: 520px;

            left: -180px;
            top: -130px;

            background: #ffffff;

            clip-path: polygon(
                0 0,
                100% 0,
                55% 45%,
                0 25%
            );
        }


        .shape2 {

            width: 650px;
            height: 520px;

            left: -80px;
            bottom: -220px;

            background: #ffffff;

            clip-path: polygon(
                0 20%,
                55% 0,
                100% 75%,
                30% 100%
            );
        }


        .shape3 {

            width: 650px;
            height: 520px;

            right: -130px;
            top: -130px;

            background: #001f65;

            clip-path: polygon(
                20% 0,
                100% 0,
                100% 100%,
                45% 55%
            );
        }


        .shape4 {

            width: 550px;
            height: 520px;

            right: -50px;
            bottom: -220px;

            background: #ffffff;

            clip-path: polygon(
                0 45%,
                65% 0,
                100% 100%,
                25% 100%
            );
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .container {

            width: 480px;

            max-width: 95vw;

            background: rgba(255, 255, 255, 0.97);

            padding: 35px 38px;

            border-radius: 14px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.25);

            position: relative;

            z-index: 2;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .shield {

            text-align: center;

            font-size: 52px;

            margin-bottom: 8px;
        }


        h2 {

            text-align: center;

            color: #064b83;

            font-size: 27px;

            margin-bottom: 10px;
        }


        .info {

            text-align: center;

            color: #555;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* =========================================================
           FORM LABELS
        ========================================================= */

        label {

            font-weight: bold;

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            color: #17324d;

            font-size: 14px;
        }


        /* =========================================================
           INPUTS
        ========================================================= */

        input {

            width: 100%;

            padding: 12px;

            box-sizing: border-box;

            border: 1px solid #c6d6e5;

            border-radius: 6px;

            font-size: 14px;

            outline: none;

            background: #ffffff;

            color: #17324d;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input:focus {

            border-color: #1976d2;

            box-shadow:
                0 0 0 3px
                rgba(25, 118, 210, 0.12);
        }


        input:read-only {

            background: #eef5fa;

            color: #526b7d;
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        button {

            width: 100%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 6px;

            background:
                linear-gradient(
                    90deg,
                    #087bd0,
                    #086db5
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        button:hover:not(:disabled) {

            transform: translateY(-1px);

            background:
                linear-gradient(
                    90deg,
                    #0b8de8,
                    #087bd0
                );

            box-shadow:
                0 5px 15px
                rgba(0, 70, 130, 0.25);
        }


        button:active:not(:disabled) {

            transform: translateY(0);
        }


        button:disabled {

            background: #aaa;

            cursor: not-allowed;

            box-shadow: none;
        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        #message {

            text-align: center;

            margin-top: 20px;

            font-weight: bold;

            min-height: 20px;

            line-height: 1.4;
        }


        /* =========================================================
           LOGIN LINK
        ========================================================= */

        .login-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            color: #555;
        }


        .login-link a {

            color: #1976d2;

            text-decoration: none;

            font-weight: bold;
        }


        .login-link a:hover {

            text-decoration: underline;

            color: #075ca8;
        }


        /* =========================================================
           BACK TO LOGIN
        ========================================================= */

        .back-login {

            position: fixed;

            bottom: 15px;

            right: 20px;

            z-index: 5;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            background:
                rgba(0, 45, 100, 0.55);

            padding: 9px 15px;

            border-radius: 20px;

            transition:
                background 0.2s ease;
        }


        .back-login:hover {

            background:
                rgba(0, 45, 100, 0.85);

            text-decoration: underline;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 550px) {

            body {

                padding: 15px;
            }


            .container {

                width: 100%;

                padding: 28px 22px;
            }


            h2 {

                font-size: 23px;
            }


            .info {

                font-size: 13px;
            }


            .back-login {

                position: static;

                display: block;

                margin-top: 15px;

                text-align: center;

                background: transparent;

                color: #ffffff;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         BACKGROUND
    ========================================================= -->

    <div class="shape shape1"></div>

    <div class="shape shape2"></div>

    <div class="shape shape3"></div>

    <div class="shape shape4"></div>


    <!-- =========================================================
         REGISTRATION CARD
    ========================================================= -->

    <div class="container">


        <!-- HEADER -->

        <div class="shield">
            🛡️
        </div>


        <h2>
            New User Registration
        </h2>


        <div class="info">

            Your email must be authorized by the
            administrator before registration.

        </div>


        <!-- =====================================================
             EMAIL
        ====================================================== -->

        <label for="email">
            Authorized Email
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter email authorized by admin"
            autocomplete="email"
        >


        <button
            type="button"
            id="sendOtpButton"
            onclick="sendOTP()"
        >
            Send OTP
        </button>


        <!-- =====================================================
             OTP
        ====================================================== -->

        <label for="otp">
            OTP
        </label>


        <input
            type="text"
            id="otp"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter 6 digit OTP"
            autocomplete="one-time-code"
        >


        <button
            type="button"
            id="verifyOtpButton"
            onclick="verifyOTP()"
            disabled
        >
            Verify OTP
        </button>


        <!-- =====================================================
             USERNAME
        ====================================================== -->

        <label for="username">
            Username
        </label>


        <input
            type="text"
            id="username"
            placeholder="Create username"
            autocomplete="username"
        >


        <!-- =====================================================
             PASSWORD
        ====================================================== -->

        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Create password"
            autocomplete="new-password"
        >


        <!-- =====================================================
             REGISTER
        ====================================================== -->

        <button
            type="button"
            id="registerButton"
            onclick="registerUser()"
            disabled
        >
            Register
        </button>


        <!-- =====================================================
             MESSAGE
        ====================================================== -->

        <p id="message"></p>


        <!-- =====================================================
             LOGIN LINK
        ====================================================== -->

        <div class="login-link">

            Already registered?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </div>


    </div>


    <!-- =========================================================
         BACK TO LOGIN
    ========================================================= -->

    <a
        href="{{ url_for('auth.login') }}"
        class="back-login"
    >
        Back to Login
    </a>


    <script>

        /* =========================================================
           OTP STATE
        ========================================================= */

        let otpVerified = false;


        /* =========================================================
           SHOW MESSAGE
        ========================================================= */

        function showMessage(message, success = false) {

            const messageElement =
                document.getElementById("message");


            messageElement.innerText = message;


            if (success) {

                messageElement.style.color = "green";

            } else {

                messageElement.style.color = "red";
            }
        }


        /* =========================================================
           SEND OTP
        ========================================================= */

        async function sendOTP() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            if (!email) {

                showMessage(
                    "Please enter your email address."
                );

                return;
            }


            const button =
                document.getElementById(
                    "sendOtpButton"
                );


            button.disabled = true;

            button.innerText = "Sending OTP...";


            try {

                const response = await fetch(
                    "{{ url_for('auth.send_registration_otp') }}",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


                const result =
                    await response.json();


                if (
                    response.ok &&
                    result.success
                ) {

                    showMessage(
                        "OTP sent successfully. Check your email.",
                        true
                    );


                    document.getElementById(
                        "verifyOtpButton"
                    ).disabled = false;

                } else {

                    showMessage(
                        result.message ||
                        "Unable to send OTP."
                    );


                    button.disabled = false;
                }


            } catch (error) {

                console.error(error);


                showMessage(
                    "Server error. Please try again."
                );


                button.disabled = false;

            } finally {

                button.innerText = "Send OTP";
            }
        }


        /* =========================================================
           VERIFY OTP
        ========================================================= */

        async function verifyOTP() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            if (!email || !otp) {

                showMessage(
                    "Enter email and OTP."
                );

                return;
            }


            if (otp.length !== 6) {

                showMessage(
                    "OTP must contain 6 digits."
                );

                return;
            }


            const button =
                document.getElementById(
                    "verifyOtpButton"
                );


            button.disabled = true;

            button.innerText = "Verifying...";


            try {

                const response = await fetch(
                    "{{ url_for('auth.verify_registration_otp') }}",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            otp: otp
                        })
                    }
                );


                const result =
                    await response.json();


                if (
                    response.ok &&
                    result.success
                ) {

                    otpVerified = true;


                    showMessage(
                        "OTP verified successfully.",
                        true
                    );


                    document.getElementById(
                        "registerButton"
                    ).disabled = false;


                    document.getElementById(
                        "email"
                    ).readOnly = true;


                    document.getElementById(
                        "otp"
                    ).readOnly = true;


                    button.innerText =
                        "OTP Verified";


                } else {

                    otpVerified = false;


                    showMessage(
                        result.message ||
                        "Invalid OTP."
                    );


                    button.disabled = false;

                    button.innerText =
                        "Verify OTP";
                }


            } catch (error) {

                console.error(error);


                showMessage(
                    "Server error. Please try again."
                );


                button.disabled = false;

                button.innerText =
                    "Verify OTP";
            }
        }


        /* =========================================================
           COMPLETE REGISTRATION
        ========================================================= */

        async function registerUser() {

            if (!otpVerified) {

                showMessage(
                    "Please verify your OTP first."
                );

                return;
            }


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (
                !email ||
                !otp ||
                !username ||
                !password
            ) {

                showMessage(
                    "Please fill all fields."
                );

                return;
            }


            const button =
                document.getElementById(
                    "registerButton"
                );


            button.disabled = true;

            button.innerText =
                "Creating account...";


            try {

                const response = await fetch(
                    "{{ url_for('auth.complete_registration') }}",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            otp: otp,

                            username: username,

                            password: password
                        })
                    }
                );


                const result =
                    await response.json();


                if (
                    response.ok &&
                    result.success
                ) {

                    showMessage(
                        "Registration successful. Redirecting to login...",
                        true
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "{{ url_for('auth.login') }}";

                        },
                        1500
                    );


                } else {

                    showMessage(
                        result.message ||
                        "Registration failed."
                    );


                    button.disabled = false;

                    button.innerText =
                        "Register";
                }


            } catch (error) {

                console.error(error);


                showMessage(
                    "Server error. Please try again."
                );


                button.disabled = false;

                button.innerText =
                    "Register";
            }
        }


        /* =========================================================
           OTP INPUT
        ========================================================= */

        document
            .getElementById("otp")
            .addEventListener(
                "input",
                function() {

                    this.value =
                        this.value
                            .replace(/\D/g, "")
                            .slice(0, 6);

                }
            );


    </script>


</body>

</html>
