<!DOCTYPE html>
<html>
<head>

    <title>Reset Password</title>

    <style>

        body {
            font-family: Arial;
            background: #eef7ff;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.15);
        }

        h2 {
            text-align: center;
            color: #087ea4;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #087ea4;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Set New Password</h2>

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="New password"
            minlength="8"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
