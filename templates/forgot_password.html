<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #eef7ff;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #087ea4;
        }

        p {
            text-align: center;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #087ea4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #056580;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087ea4;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            background: #ffecec;
            color: #c00;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <p>
        Enter your registered email address.
        We will send you an OTP.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <a class="back" href="{{ url_for('auth.login') }}">
        ← Back to Login
    </a>

</div>

</body>
</html>
